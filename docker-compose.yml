version: '3.8'

services:
  # PsyFi API Service
  psyfi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psyfi-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      # Match Dockerfile — python:slim has no curl
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Same API image with NVIDIA Container Toolkit GPU reservation.
  # WebGPU still runs in the host browser on the RTX card; this profile
  # documents host readiness and exposes the GPU to the container for ops /
  # future CUDA workers. See docs/NVIDIA_GPU.md
  psyfi-nvidia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psyfi-api-nvidia
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      - PSYFI_GPU_VENDOR=nvidia
    restart: unless-stopped
    gpus: all
    profiles:
      - nvidia
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: psyfi-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    depends_on:
      - psyfi
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: psyfi-network
