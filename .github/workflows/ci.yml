name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests
      run: python -m pytest -q
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
    - name: Install JavaScript dependencies
      run: npm ci
    - name: Lint the README
      run: npx remark README.md --frail --quiet --no-stdout
    - name: GPU test, typecheck, and build
      run: |
        npm run gpu:test
        npm run gpu:typecheck
        npm run gpu:build
